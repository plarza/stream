name: Stream
options:
  bundleIdPrefix: network.aza
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: H5A6B4L9W8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_COMPILATION_MODE: wholemodule
    OTHER_LDFLAGS: ["-lresolv"]
targets:
  Stream-iOS:
    type: application
    platform: iOS
    scheme:
      testTargets: [StreamUITests-iOS]
    sources:
      - path: Shared
      - path: iOS
      - path: Generated/StreamCore.swift
    dependencies:
      - framework: Generated/StreamCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.aza.stream
        PRODUCT_NAME: Stream
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Stream
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Stream copies your library from your Mac over Wi-Fi.
        NSBonjourServices: [_streamsync._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUserActivityTypes: [network.aza.stream.playing]
        CFBundleURLTypes:
          - CFBundleURLName: network.aza.stream
            CFBundleURLSchemes: [network-aza-stream]
        ITSAppUsesNonExemptEncryption: false
  StreamUITests-iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: tests/Shared
      - path: tests/iOSUITests
    dependencies:
      - target: Stream-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.aza.stream.uitests
        TEST_TARGET_NAME: Stream-iOS
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  Stream-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
      - path: Generated/StreamCore.swift
    dependencies:
      - framework: Generated/StreamCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: CoreAudio.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.aza.stream
        PRODUCT_NAME: Stream
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/Stream.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Stream
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        NSLocalNetworkUsageDescription: Stream shares your library with your iPhone over Wi-Fi.
        NSBonjourServices: [_streamsync._tcp]
        NSUserActivityTypes: [network.aza.stream.playing]
        CFBundleURLTypes:
          - CFBundleURLName: network.aza.stream
            CFBundleURLSchemes: [network-aza-stream]
    entitlements:
      path: macOS/Stream.entitlements
      properties:
        com.apple.security.app-sandbox: false
