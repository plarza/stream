name: Stream
options:
  bundleIdPrefix: network.aza
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  AzaUI:
    url: https://github.com/plarza/ui
    from: 0.1.1
settings:
  base:
    DEVELOPMENT_TEAM: H5A6B4L9W8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_COMPILATION_MODE: wholemodule
    OTHER_LDFLAGS: ["-lresolv"]
targets:
  # The Rust core's UniFFI bindings, generated by scripts/build-core.sh. Their own module, so the app's
  # main-actor default doesn't make every call into the core main-actor code.
  StreamBindings:
    type: library.static
    platform: [iOS, macOS]
    sources:
      - path: Generated/StreamCore.swift
    dependencies:
      - framework: Generated/StreamCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: StreamBindings
        PRODUCT_MODULE_NAME: StreamBindings
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_APPROACHABLE_CONCURRENCY: NO
  Stream-iOS:
    type: application
    platform: iOS
    scheme:
      testTargets: [StreamUITests-iOS]
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - framework: Generated/StreamCore.xcframework
        embed: false
      - target: StreamBindings_iOS
      - package: AzaUI
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.aza.stream
        PRODUCT_NAME: Stream
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Stream
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Stream copies your library from your Mac over Wi-Fi.
        NSBonjourServices: [_streamsync._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUserActivityTypes: [network.aza.stream.playing]
        CFBundleURLTypes:
          - CFBundleURLName: network.aza.stream
            CFBundleURLSchemes: [network-aza-stream]
        ITSAppUsesNonExemptEncryption: false
  StreamUITests-iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: tests/Shared
      - path: tests/iOSUITests
    dependencies:
      - target: Stream-iOS
      - package: AzaUI
        product: UITestSupport
    settings:
      base:
        # XCTestCase's overrides are nonisolated, so tests can't default to the main actor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: network.aza.stream.uitests
        TEST_TARGET_NAME: Stream-iOS
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  Stream-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
    dependencies:
      - framework: Generated/StreamCore.xcframework
        embed: false
      - target: StreamBindings_macOS
      - package: AzaUI
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: CoreAudio.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.aza.stream
        PRODUCT_NAME: Stream
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/Stream.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Stream
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        NSLocalNetworkUsageDescription: Stream shares your library with your iPhone over Wi-Fi.
        NSBonjourServices: [_streamsync._tcp]
        NSUserActivityTypes: [network.aza.stream.playing]
        CFBundleURLTypes:
          - CFBundleURLName: network.aza.stream
            CFBundleURLSchemes: [network-aza-stream]
    entitlements:
      path: macOS/Stream.entitlements
      properties:
        com.apple.security.app-sandbox: false
