[package]
name = "music-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "music_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs"] }
futures-util = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "http2", "form", "query", "stream"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { version = "0.8", default-features = false }
librespot-protocol = { version = "0.8", default-features = false }
librespot-audio = { version = "0.8", default-features = false }
protobuf = "3"
symphonia = { version = "0.6", default-features = false, features = ["flac", "mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "wav", "aiff", "pcm"] }
lofty = "0.25"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
rtrb = "0.3"
rubato = "0.16"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.9"
urlencoding = "2"
blake3 = "1"
symphonia-adapter-libopus = "0.3"
walkdir = "2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "debuginfo"

[patch.crates-io]
sysinfo = { path = "vendor/sysinfo-shim" }
